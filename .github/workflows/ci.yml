name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The 'snapshot' Magit channel tracks magit's `main` and is expected to
    # break occasionally; it runs as an early-warning signal and does not fail
    # the build.  The 'released' channel (latest Magit on (Non)GNU ELPA) is the
    # one we commit to supporting and must pass.
    continue-on-error: ${{ matrix.magit == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.4'
          - '30.1'
          - snapshot
        magit:
          - released
          - snapshot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs ${{ matrix.emacs_version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install Eldev
        run: curl -fsSL https://raw.github.com/emacs-eldev/eldev/master/webinstall/github-eldev | sh

      - name: Install difftastic
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/Wilfred/difftastic/releases/latest/download/difft-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          emacs --version | head -1
          difft --version
          git --version

      - name: Run tests
        # `--unstable` makes Eldev prefer bleeding-edge archives (MELPA Unstable
        # / (Non)GNU-devel), pulling Magit's snapshot; without it Eldev resolves
        # the latest *released* Magit.
        run: eldev $ELDEV_FLAGS -p -dtT test
        env:
          ELDEV_FLAGS: ${{ matrix.magit == 'snapshot' && '--unstable' || '' }}
